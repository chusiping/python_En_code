<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS调度系统</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 20px 30px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 20px; font-size: 20px; }
        .nav-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 12px 20px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        .nav-btn.config { background: #4CAF50; }
        .nav-btn.xlsx { background: #2196F3; }
        .nav-btn.export { background: #9C27B0; }
        .nav-btn.admin { background: #FF9800; }
        .nav-btn.logout { background: #666; }
        
        .user-info {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GPS调度系统</h1>
        <div class="user-info">当前用户: <span id="username"></span></div>
        
        <div class="nav-grid">
            <a href="/config" class="nav-btn config">
                <span>⚙️</span>
                <span>配置管理</span>
            </a>
            <a href="/xlsx" class="nav-btn xlsx">
                <span>📁</span>
                <span>上传轨迹文件</span>
            </a>
            <a href="/exportjson" class="nav-btn export">
                <span>📄</span>
                <span>导出JSON</span>
            </a>
            <a href="/admin" class="nav-btn admin" id="adminBtn" style="display:none">
                <span>👤</span>
                <span>用户管理</span>
            </a>
            <a href="#" class="nav-btn logout" onclick="logout()">
                <span>🚪</span>
                <span>退出登录</span>
            </a>
        </div>
    </div>

    <script>
        async function checkAdmin() {
            const res = await fetch('/api/check-admin');
            const data = await res.json();
            if (data.isAdmin) {
                document.getElementById('adminBtn').style.display = 'flex';
            }
        }

        async function logout() {
            await fetch('/api/logout', {method: 'POST'});
            location.href = '/login';
        }

        async function getUsername() {
            const res = await fetch('/api/check-admin');
            const data = await res.json();
            document.getElementById('username').textContent = data.username || '未知';
        }

        getUsername();
        checkAdmin();
    </script>
</body>
</html>
