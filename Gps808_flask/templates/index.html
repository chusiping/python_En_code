<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS调度系统</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            text-align: center;
            min-width: 400px;
        }
        h1 { color: #333; margin-bottom: 30px; }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .nav-btn {
            padding: 30px 20px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .nav-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .nav-btn.config { background: #4CAF50; }
        .nav-btn.xlsx { background: #2196F3; }
        .nav-btn.admin { background: #FF9800; grid-column: span 2; }
        .nav-btn.logout { background: #666; grid-column: span 2; }
        
        .user-info {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GPS调度系统</h1>
        <div class="user-info">当前用户: <span id="username"></span></div>
        
        <div class="nav-grid">
            <a href="/config" class="nav-btn config">
                <span>⚙️</span>
                <span>配置管理</span>
            </a>
            <a href="/xlsx" class="nav-btn xlsx">
                <span>📁</span>
                <span>上传轨迹文件</span>
            </a>
            <a href="/admin" class="nav-btn admin" id="adminBtn" style="display:none">
                <span>👤</span>
                <span>用户管理</span>
            </a>
            <a href="#" class="nav-btn logout" onclick="logout()">
                <span>🚪</span>
                <span>退出登录</span>
            </a>
        </div>
    </div>

    <script>
        async function checkAdmin() {
            const res = await fetch('/api/check-admin');
            const data = await res.json();
            if (data.isAdmin) {
                document.getElementById('adminBtn').style.display = 'flex';
            }
        }

        async function logout() {
            await fetch('/api/logout', {method: 'POST'});
            location.href = '/login';
        }

        async function getUsername() {
            const res = await fetch('/api/check-admin');
            const data = await res.json();
            document.getElementById('username').textContent = data.username || '未知';
        }

        getUsername();
        checkAdmin();
    </script>
</body>
</html>
